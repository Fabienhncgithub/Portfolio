name: Uptime

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        host: [www.fabienhance.com, fabienhance.com, cms.fabienhance.com, fabrun.fabienhance.com]

    steps:
      - name: Check HTTPS response
        run: |
          curl --silent --show-error --output /dev/null --max-time 20 \
            --retry 2 --retry-all-errors --fail "https://${{ matrix.host }}/"

      - name: Check certificate expiry
        run: |
          expiry="$(echo | openssl s_client -connect "${{ matrix.host }}:443" \
            -servername "${{ matrix.host }}" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)"
          echo "Certificate expires ${expiry}"
          if [ $(( ($(date -d "${expiry}" +%s) - $(date +%s)) / 86400 )) -lt 14 ]; then
            echo "::error::Certificate for ${{ matrix.host }} expires in less than 14 days"
            exit 1
          fi
